name: Build et tests (Windows)

# Lancement manuel seulement : rien ne tourne (ni ne coûte) tout seul.
on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Tests de la logique
        run: dotnet test tests/Compteur.Logique.Tests/Compteur.Logique.Tests.csproj --configuration Release

      - name: Build de l'app WinUI
        run: dotnet build src/Compteur.App/Compteur.csproj --configuration Debug -p:Platform=x64
